# Application
spring.application.name=${APP_NAME:eventy-users-service}

# Database Configuration (All values pulled directly from docker-compose/environment)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate (Essential settings)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration (All values pulled directly from docker-compose/environment)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI}