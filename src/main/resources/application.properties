# Application
spring.application.name=${APP_NAME:eventy-users-service}

# Database Configuration (All values pulled directly from docker-compose/environment)
spring.datasource.url=${DATABASE_URL}

# JPA/Hibernate (Essential settings)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true 

# JWT Configuration (All values pulled directly from docker-compose/environment)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI}

# DEBUGGING CRITICAL: Activate debug logging for the UserController to trace issues
logging.level.com.eventy.userservice.controller=DEBUG

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
# Utilisation de la variable d'environnement ou fallback sur localhost
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true