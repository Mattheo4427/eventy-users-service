# Application
spring.application.name=${APP_NAME:eventy-users-service}

# Database Configuration (All values pulled directly from docker-compose/environment)
spring.datasource.url=${DATABASE_URL}

# JPA/Hibernate (Essential settings)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true 

spring.flyway.enabled=true
# baseline-on-migrate permet de créer la table de migration même si la BDD n'est pas vide
spring.flyway.baseline-on-migrate=true

# JWT Configuration (All values pulled directly from docker-compose/environment)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI}

# DEBUGGING CRITICAL: Activate debug logging for the UserController to trace issues
logging.level.com.eventy.userservice.controller=DEBUG

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
# Utilisation de la variable d'environnement ou fallback sur localhost
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Configuration Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.consumer.group-id=users-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

keycloak.server-url=${KEYCLOAK_SERVER_URL:http://localhost:8090}
keycloak.realm=${KEYCLOAK_REALM:eventy-realm}

keycloak.admin.realm=${KEYCLOAK_ADMIN_REALM:eventy-realm}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
keycloak.admin.username=${KEYCLOAK_ADMIN_USERNAME:admin}
keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD:admin}